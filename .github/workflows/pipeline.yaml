name: Pipeline
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every check when invoked as a reusable workflow
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    outputs:
      library: ${{ steps.select.outputs.library }}
      tooling: ${{ steps.select.outputs.tooling }}
      production: ${{ steps.select.outputs.production }}
      audit: ${{ steps.select.outputs.audit }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js without installing dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Select checks from all changed files
        id: select
        env:
          ESM_CI_FULL: ${{ inputs.full == true }}
        run: node script/src/esm/ci-changes.ts

  library:
    needs: changes
    if: needs.changes.outputs.library == 'true'
    name: Library / ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-2022]
        node-version: [22, 24, 26]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          install: false
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # Native-addon test fixtures require MSVC; cl.exe is not on PATH by
      # default on GitHub-hosted Windows runners.
      - name: Set up MSVC for the native-addon fixture
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Refresh the lockfile before re-enabling frozen installs; lockfile
      # changes are kept out of incremental patches.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare vendor fixtures
        uses: ./.github/actions/prepare-fixtures
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' && matrix.node-version == 24 }}

      - name: Read Windows Node version
        if: runner.os == 'Windows'
        id: node
        shell: pwsh
        run: node -p "'version=' + process.versions.node" >> $env:GITHUB_OUTPUT

      - name: Cache Windows Node-API build files
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/node-api-${{ steps.node.outputs.version }}
          key: node-api-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.version }}

      # pnpm's Windows Node runtime contains node.exe but not the C headers or
      # import library required to compile the Node-API test fixture.
      - name: Prepare Windows Node-API build files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "process.versions.node"
          $base = "https://nodejs.org/dist/v$version"
          $directory = Join-Path $env:RUNNER_TEMP "node-api-$version"
          $headers = Join-Path $directory "node-v$version/include/node"
          if (!(Test-Path (Join-Path $headers 'node_api.h')) -or !(Test-Path (Join-Path $directory 'node.lib'))) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            $archive = Join-Path $directory 'headers.tar.gz'
            Invoke-WebRequest "$base/node-v$version-headers.tar.gz" -OutFile $archive
            tar -xzf $archive -C $directory
            if ($LASTEXITCODE -ne 0) { throw 'Node-API header extraction failed' }
            Remove-Item $archive
            Invoke-WebRequest "$base/win-x64/node.lib" -OutFile (Join-Path $directory 'node.lib')
          }
          if (!(Test-Path (Join-Path $headers 'node_api.h'))) { throw 'Node-API headers are missing' }
          "ESM_SYNC_NODE_HEADERS=$headers" >> $env:GITHUB_ENV
          "ESM_SYNC_NODE_LIB=$directory" >> $env:GITHUB_ENV

      - name: Build test bundles and native await bridge
        run: pnpm build --test

      - name: Test library behaviour and native Node integration
        run: pnpm test:vitest --suite=runtime

      # The installed package's native bridge is platform-specific, but there
      # is no reason to repeat package smoke tests on every Node version.
      - name: Test installed CJS and ESM consumers (Node 24)
        if: matrix.node-version == 24
        run: pnpm test:packed --format=both

  tooling:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    name: Tooling, build and release / Ubuntu / Node 24
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Audit production dependencies
        if: needs.changes.outputs.audit == 'true'
        run: pnpm audit:prod

      - name: Check formatting and lint
        run: pnpm lint

      - name: Type-check implementation, tooling, harness, declarations and fixtures
        run: pnpm typecheck

      - name: Prepare vendor fixtures
        uses: ./.github/actions/prepare-fixtures
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Build test bundles and native await bridge
        run: pnpm build --test

      - name: Test tooling, fixtures, build and release logic
        run: pnpm test:vitest --suite=tooling

      - name: Verify production build and tests
        if: needs.changes.outputs.production == 'true'
        run: pnpm verify:prod

      - name: Test registry publish/install with CJS and ESM consumers
        if: needs.changes.outputs.production == 'true'
        run: pnpm test:verdaccio

  ci:
    name: CI
    if: always()
    needs: [changes, library, tooling]
    runs-on: ubuntu-24.04
    steps:
      # Keep one required check successful for intentional skips, while
      # propagating selection, test, and cancellation failures.
      - name: Check selected job results
        env:
          CHANGES: ${{ needs.changes.result }}
          LIBRARY_SELECTED: ${{ needs.changes.outputs.library }}
          TOOLING_SELECTED: ${{ needs.changes.outputs.tooling }}
          LIBRARY: ${{ needs.library.result }}
          TOOLING: ${{ needs.tooling.result }}
        run: |
          test "$CHANGES" = success
          for result in "$LIBRARY_SELECTED:$LIBRARY" "$TOOLING_SELECTED:$TOOLING"; do
            case "$result" in
              true:success|false:success|false:skipped) ;;
              *) exit 1 ;;
            esac
          done
