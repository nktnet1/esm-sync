name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/pipeline.yaml

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable pnpm via corepack
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js and npm
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Follow Pipeline until its lockfile refresh is committed.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare vendor fixtures
        uses: ./.github/actions/prepare-fixtures

      - name: Build production package with a required native bridge
        run: pnpm build:prod --test

      - name: Confirm the tagged commit is being packaged
        env:
          BUILD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$BUILD_SHA"

      - name: Stage release files
        run: pnpm release:pack

      - name: Pack without running lifecycle scripts
        run: |
          mkdir -p release-packages
          npm pack .release/package --pack-destination release-packages --ignore-scripts
          test "$(find release-packages -maxdepth 1 -name '*.tgz' -type f | wc -l)" -eq 1

      - name: Validate the tarball and its version
        run: node script/src/esm/publish-release-package.ts --tag="$GITHUB_REF_NAME" --registry=https://registry.npmjs.org --dry-run
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-packages/*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Write release metadata
        run: |
          mkdir -p release-metadata
          printf '%s\n' "$GITHUB_REF_NAME" > release-metadata/tag
          printf '%s\n' "$GITHUB_SHA" > release-metadata/sha

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata/
          if-no-files-found: error
          retention-days: 7
