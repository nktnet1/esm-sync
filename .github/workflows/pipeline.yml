name: Pipeline
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-2022]
        node-version: [22, 24, 26]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          install: false
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # Native-addon test fixtures require MSVC; cl.exe is not on PATH by
      # default on GitHub-hosted Windows runners.
      - name: Set up MSVC for the native-addon fixture
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Refresh the lockfile before re-enabling frozen installs; lockfile
      # changes are kept out of incremental patches.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Audit production dependencies once (Linux / Node 26), rather than in
      # every OS job. Review development-only advisories separately.
      - name: Audit production dependencies
        if: runner.os == 'Linux' && matrix.node-version == 26
        run: pnpm audit:prod

      - name: Check formatting and lint (Linux / Node 26)
        if: runner.os == 'Linux' && matrix.node-version == 26
        run: pnpm lint

      - name: Type-check implementation, tooling, harness, declarations and fixtures
        run: pnpm typecheck

      - name: Prepare vendor fixtures
        run: pnpm fixtures:prepare

      # pnpm's Windows Node runtime contains node.exe but not the C headers or
      # import library required to compile the Node-API test fixture.
      - name: Prepare Windows Node-API build files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "process.versions.node"
          $base = "https://nodejs.org/dist/v$version"
          $directory = Join-Path $env:RUNNER_TEMP "node-api-$version"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $archive = Join-Path $directory 'headers.tar.gz'
          Invoke-WebRequest "$base/node-v$version-headers.tar.gz" -OutFile $archive
          tar -xzf $archive -C $directory
          $headers = Join-Path $directory "node-v$version/include/node"
          if (!(Test-Path (Join-Path $headers 'node_api.h'))) { throw 'Node-API headers are missing' }
          Invoke-WebRequest "$base/win-x64/node.lib" -OutFile (Join-Path $directory 'node.lib')
          "ESM_SYNC_NODE_HEADERS=$headers" >> $env:GITHUB_ENV
          "ESM_SYNC_NODE_LIB=$directory" >> $env:GITHUB_ENV

      - name: Build test bundles and native await bridge
        run: pnpm build --test

      - name: Run Vitest (unit and isolated native-Node integration tests)
        run: pnpm test:vitest

      - name: Verify production build and tests on Node 26
        if: matrix.node-version == 26
        run: pnpm verify:prod

      # Keep CJS coverage on the existing matrix; add an ESM consumer only once.
      - name: Test installed package from tarball
        run: pnpm test:packed --format=${{ runner.os == 'Linux' && matrix.node-version == 24 && 'both' || 'cjs' }}

      - name: Test registry publish/install with CJS and ESM consumers (Linux / Node 24)
        if: runner.os == 'Linux' && matrix.node-version == 24
        run: pnpm test:verdaccio
