name: Pipeline
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - '**/README.md'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          install: false

      # The lockfile must be refreshed after the Lefthook migration before
      # frozen installs can be re-enabled. Lockfile changes are kept out of patches.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run tests
        run: pnpm test
