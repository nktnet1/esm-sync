name: Pipeline
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - '**/README.md'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          install: false
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # The lockfile must be refreshed after the Lefthook migration before
      # frozen installs can be re-enabled. Lockfile changes are kept out of patches.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint without modifying files
        run: pnpm lint

      - name: Type-check declarations and fixtures
        run: pnpm typecheck

      - name: Prepare vendor fixtures
        run: pnpm fixtures:prepare

      - name: Build test bundles
        run: pnpm build --test

      - name: Run Vitest (unit and isolated native-Node integration tests)
        run: pnpm test:vitest

      - name: Verify production build and tests on Node 26
        if: matrix.node-version == 26
        run: pnpm verify:prod

      - name: Test installed package from tarball
        run: pnpm test:packed
